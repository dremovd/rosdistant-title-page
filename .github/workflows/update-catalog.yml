name: Update catalog from tltsu.ru

on:
  schedule:
    - cron: "17 3 * * 1"   # по понедельникам, 06:17 МСК
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # При ошибке сети или подозрительном результате скрипт падает, старый справочник остаётся.
      - run: npm run update:catalog
      - id: diff
        name: Изменилось ли что-то кроме даты загрузки
        run: |
          if node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const strip = (text) => { const c = JSON.parse(text); delete c.fetchedAt; return JSON.stringify(c); };
            const same = (f) => {
              let old = "";
              try { old = execSync(`git show HEAD:${f}`, { encoding: "utf8", maxBuffer: 1 << 26 }); } catch { return false; }
              return strip(old) === strip(fs.readFileSync(f, "utf8"));
            };
            process.exit(["catalog", "staff", "groups"].every((n) => same(`data/${n}.json`)) ? 0 : 1);
          '; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Коммит и деплой
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/staff.json data/groups.json
          git commit -m "Обновление справочников с tltsu.ru"
          git push
          # Пуш от GITHUB_TOKEN не запускает другие workflow — запускаем деплой явно.
          gh workflow run deploy.yml --ref main
